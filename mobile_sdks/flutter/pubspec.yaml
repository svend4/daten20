name: dms_sdk
description: DMS Flutter SDK for iOS, Android, Web, and Desktop
version: 2.6.0
homepage: https://github.com/example/dms-flutter-sdk

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP & WebSocket
  http: ^1.1.2
  web_socket_channel: ^2.4.0

  # JSON serialization
  json_annotation: ^4.8.1

  # Secure storage
  flutter_secure_storage: ^9.0.0

  # Push notifications
  firebase_messaging: ^14.7.9
  flutter_local_notifications: ^16.3.0

  # State management
  provider: ^6.1.1

  # Logging
  logger: ^2.0.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  mockito: ^5.4.4

flutter:
  plugin:
    platforms:
      android:
        package: com.example.dms_sdk
        pluginClass: DmsSdkPlugin
      ios:
        pluginClass: DmsSdkPlugin
      linux:
        pluginClass: DmsSdkPlugin
      macos:
        pluginClass: DmsSdkPlugin
      windows:
        pluginClass: DmsSdkPlugin
      web:
        pluginClass: DmsSdkWeb
        fileName: dms_sdk_web.dart

# Publishing configuration
publish_to: 'none' # Remove this line to publish to pub.dev

# The following section is specific to Flutter packages.
flutter:
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' specifies the class (in Java, Kotlin, Swift, Objective-C, etc.)
  # which should be registered in the plugin registry. This is required for
  # using method channels.
  # The Android package uniquely identifies your Flutter plugin for Android.
  # The iOS name uniquely identifies your Flutter plugin for iOS.
