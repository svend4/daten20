[pytest]
# pytest configuration for Document Management System

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Console output options
addopts =
    # Show verbose output
    -v
    # Show local variables in tracebacks
    -l
    # Show summary of all test outcomes
    -ra
    # Show extra test summary info
    --tb=short
    # Show warnings
    -W ignore::DeprecationWarning
    # Coverage options
    --cov=src
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    # Fail if coverage is below threshold (starting at 3%, will increase gradually to 80%)
    # Note: Low threshold because we're only testing new applications, not the entire codebase
    --cov-fail-under=3
    # Show slowest tests
    --durations=10

# Coverage configuration
[coverage:run]
source =
    src/
    .

omit =
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */env/*
    */.venv/*
    */site-packages/*
    setup.py

branch = True
parallel = True

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Exclude lines from coverage
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod

[coverage:html]
directory = htmlcov

[coverage:xml]
output = coverage.xml

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    smoke: marks tests as smoke tests
    regression: marks tests as regression tests
    performance: marks tests as performance benchmarks (optional, not required for basic functionality)
    benchmark: marks tests as performance benchmarks using pytest-benchmark
    enterprise: marks tests for enterprise features (v3.0+, not yet fully implemented)
    security: marks tests for security features
    e2e: marks tests as end-to-end tests

# Minimum Python version
minversion = 3.8

# Strict markers - fail on unknown markers
#addopts = --strict-markers

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (in seconds) - prevents hanging tests
timeout = 300

# Parallel execution (install pytest-xdist)
# Uncomment to enable: addopts = -n auto
