apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-app
  labels:
    app: dms
    component: app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: dms
      component: app
  template:
    metadata:
      labels:
        app: dms
        component: app
    spec:
      containers:
      - name: dms
        image: dms:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: FLASK_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: dms-secrets
              key: database-url
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: dms-secrets
              key: secret-key
        - name: REDIS_URL
          value: "redis://redis-service:6379/0"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /app/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: dms-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: dms-service
  labels:
    app: dms
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: dms
    component: app
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dms-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
