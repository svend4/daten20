    "spacy>=3.7.2",
    "nltk>=3.8.1",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.3",
    "lightgbm>=4.1.0"
]
ml = [
    "mlflow>=2.9.2",
    "wandb>=0.16.2",
    "optuna>=3.5.0",
    "shap>=0.44.0",
    "lime>=0.2.0.1"
]
quantum = [
