[pytest]
# Performance Tests Configuration

# Benchmark settings
benchmark_min_rounds = 5
benchmark_max_time = 5.0
benchmark_min_time = 0.000005
benchmark_timer = time.perf_counter
benchmark_warmup = true
benchmark_warmup_iterations = 10
benchmark_disable_gc = false
benchmark_group_by = func

# Test markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    benchmark: marks tests as benchmark tests
    memory: marks tests that profile memory usage

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
console_output_style = progress
log_cli = false
log_cli_level = INFO

# Coverage (optional for performance tests)
addopts = --tb=short --strict-markers -v
