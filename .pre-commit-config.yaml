# Pre-commit hooks configuration
# Install: pip install pre-commit
# Setup: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Black - Python code formatter
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        language_version: python3.9
        args: ['--line-length=120']
        exclude: ^(data/|backups/|logs/|\.venv/|venv/|build/|dist/)

  # isort - Import statement organizer
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ['--profile=black', '--line-length=120']
        exclude: ^(data/|backups/|logs/|\.venv/|venv/|build/|dist/)

  # Flake8 - Style guide enforcement
  - repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ['--config=.flake8']
        additional_dependencies:
          - flake8-bugbear
          - flake8-comprehensions
          - flake8-simplify
        exclude: ^(data/|backups/|logs/|\.venv/|venv/|build/|dist/)

  # MyPy - Static type checker
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        args: ['--config-file=mypy.ini']
        additional_dependencies:
          - types-requests
          - types-redis
          - types-PyYAML
        exclude: ^(tests/|data/|backups/|logs/|\.venv/|venv/|build/|dist/)

  # Bandit - Security linter
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args: ['-c', '.bandit', '-r', 'src/']
        exclude: ^(tests/|data/|backups/|logs/|\.venv/|venv/)

  # Safety - Dependency security checker
  - repo: https://github.com/Lucas-C/pre-commit-hooks-safety
    rev: v1.3.3
    hooks:
      - id: python-safety-dependencies-check
        files: requirements.txt

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # Remove trailing whitespace
      - id: trailing-whitespace
        exclude: ^(data/|backups/|logs/|\.md$)

      # Ensure files end with newline
      - id: end-of-file-fixer
        exclude: ^(data/|backups/|logs/)

      # Check YAML syntax
      - id: check-yaml
        args: ['--safe']

      # Check JSON syntax
      - id: check-json

      # Check for merge conflicts
      - id: check-merge-conflict

      # Check for large files
      - id: check-added-large-files
        args: ['--maxkb=1000']

      # Check Python syntax
      - id: check-ast

      # Check for debugger imports
      - id: debug-statements

      # Detect private keys
      - id: detect-private-key

      # Check for case conflicts
      - id: check-case-conflict

      # Mixed line endings
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Prettier - Format Markdown, YAML, JSON
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [markdown, yaml, json]
        exclude: ^(data/|backups/|logs/|\.venv/|venv/)

  # Check requirements.txt
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
      - id: python-check-blanket-type-ignore
      - id: python-no-eval
      - id: python-no-log-warn
      - id: python-use-type-annotations
      - id: text-unicode-replacement-char

# Exclude patterns for all hooks
exclude: |
  (?x)^(
    data/.*|
    backups/.*|
    logs/.*|
    \.venv/.*|
    venv/.*|
    build/.*|
    dist/.*|
    .*\.egg-info/.*|
    __pycache__/.*|
    \.pytest_cache/.*|
    \.mypy_cache/.*|
    mSchablone$
  )

# Fail fast - stop on first failure
fail_fast: false

# Default language version
default_language_version:
  python: python3.9

# Minimum pre-commit version
minimum_pre_commit_version: '3.0.0'
