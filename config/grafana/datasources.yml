# Grafana Datasources Configuration
# Version: 1.0
# Date: 2026-01-16

apiVersion: 1

# List of datasources to insert/update
datasources:
  # Prometheus datasource
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    version: 1
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: "15s"
      queryTimeout: "60s"
      exemplarTraceIdDestinations:
        # Jaeger integration (if available)
        - name: traceID
          datasourceUid: jaeger-uid

  # Loki datasource (if logs aggregation is needed)
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    version: 1
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: jaeger-uid
          matcherRegex: "traceID=(\\w+)"
          name: TraceID
          url: "$${__value.raw}"

  # Alertmanager datasource
  - name: Alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    isDefault: false
    version: 1
    editable: true
    jsonData:
      implementation: prometheus

  # TestData datasource (for testing)
  - name: TestData
    type: testdata
    access: proxy
    isDefault: false
    version: 1
    editable: false
