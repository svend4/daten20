# Codecov Configuration
# Documentation: https://docs.codecov.io/docs/codecov-yaml

codecov:
  require_ci_to_pass: no  # Don't block CI if Codecov fails
  notify:
    wait_for_ci: yes  # Wait for CI to complete before processing

coverage:
  precision: 2  # 2 decimal places
  round: down
  range: "70...100"  # Yellow from 70-90%, green from 90-100%

  status:
    project:
      default:
        target: auto  # Auto-adjust based on previous coverage
        threshold: 1%  # Allow 1% decrease
        if_ci_failed: error

    patch:
      default:
        target: 80%  # New code should have 80% coverage
        threshold: 5%  # Allow 5% decrease for patches

    changes:
      default:
        if_ci_failed: error

# Coverage targets for different parts of the codebase
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%

      cli-tools:
        target: 70%
        paths:
          - "doc-*.py"
          - "dms-admin.py"
          - "enterprise-admin.py"

      core-modules:
        target: 80%
        paths:
          - "src/core/"
          - "src/utils/"

      ai-modules:
        target: 60%
        paths:
          - "src/ai/"
          - "src/agi/"
          - "src/ml/"

      api-modules:
        target: 75%
        paths:
          - "src/api*.py"

# Comment settings for pull requests
comment:
  layout: "reach,diff,flags,tree,betaprofiling"
  behavior: default
  require_changes: no  # Always comment, even if no changes
  require_base: no     # Comment even without base report
  require_head: yes    # Require head report

# Ignore specific files/paths
ignore:
  - "tests/"
  - "**/__pycache__/"
  - "**/venv/"
  - "**/env/"
  - "**/.venv/"
  - "setup.py"
  - "locustfile.py"
  - "**/*_test.py"
  - "**/test_*.py"

# Flags to organize coverage
flags:
  unittests:
    paths:
      - tests/
    carryforward: true  # Use previous reports if current run fails

  cli:
    paths:
      - doc-*.py
      - dms-admin.py
    carryforward: true

  core:
    paths:
      - src/core/
      - src/utils/
    carryforward: true

  ai:
    paths:
      - src/ai/
      - src/agi/
      - src/ml/
    carryforward: true
