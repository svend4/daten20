name: E2E Tests

on:
  push:
    branches: [ main, develop, claude/** ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run E2E tests nightly at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  e2e-consciousness:
    name: E2E Consciousness Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-timeout pytest-xdist

    - name: Run E2E Consciousness Tests
      timeout-minutes: 20
      run: |
        pytest tests/e2e/test_consciousness_e2e.py \
          -v \
          --tb=short \
          --timeout=300 \
          --durations=10 \
          --junit-xml=e2e-results/consciousness.xml

    - name: Upload E2E test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-consciousness-results
        path: e2e-results/
        retention-days: 30

    - name: Generate E2E summary
      if: always()
      run: |
        echo "## E2E Consciousness Tests Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "**Duration:** $(date)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        pytest tests/e2e/test_consciousness_e2e.py --collect-only -q | head -20 >> $GITHUB_STEP_SUMMARY || true

  e2e-advanced-ai:
    name: E2E Advanced AI Integration
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-timeout

    - name: Run E2E Advanced AI Tests
      timeout-minutes: 20
      run: |
        pytest tests/integration/advanced_ai/ \
          -v \
          --tb=short \
          --timeout=300 \
          --durations=10 \
          --junit-xml=e2e-results/advanced-ai.xml

    - name: Upload E2E test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-advanced-ai-results
        path: e2e-results/
        retention-days: 30

  e2e-full-system:
    name: E2E Full System Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [e2e-consciousness, e2e-advanced-ai]

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: daten20_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y poppler-utils tesseract-ocr

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-timeout pytest-xdist

    - name: Start application server
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/daten20_test
        REDIS_URL: redis://localhost:6379/0
      run: |
        python -m src.app &
        echo $! > app.pid
        sleep 10
      continue-on-error: true

    - name: Run full system E2E tests
      timeout-minutes: 30
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/daten20_test
        REDIS_URL: redis://localhost:6379/0
      run: |
        pytest tests/e2e/ \
          -v \
          --tb=short \
          --timeout=600 \
          --durations=20 \
          --junit-xml=e2e-results/full-system.xml

    - name: Stop application server
      if: always()
      run: |
        if [ -f app.pid ]; then
          kill $(cat app.pid) || true
        fi

    - name: Upload full system test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-full-system-results
        path: e2e-results/
        retention-days: 30

    - name: Upload application logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: application-logs
        path: |
          logs/
          *.log
        retention-days: 7

  e2e-summary:
    name: E2E Tests Summary
    runs-on: ubuntu-latest
    needs: [e2e-consciousness, e2e-advanced-ai, e2e-full-system]
    if: always()

    steps:
    - name: Generate summary report
      run: |
        echo "## 🧪 E2E Tests Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Workflow:** ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Test Results" >> $GITHUB_STEP_SUMMARY
        echo "- Consciousness E2E: ${{ needs.e2e-consciousness.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Advanced AI E2E: ${{ needs.e2e-advanced-ai.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Full System E2E: ${{ needs.e2e-full-system.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ "${{ needs.e2e-consciousness.result }}" == "success" ] && \
           [ "${{ needs.e2e-advanced-ai.result }}" == "success" ] && \
           [ "${{ needs.e2e-full-system.result }}" == "success" ]; then
          echo "✅ All E2E tests passed successfully!" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Some E2E tests failed. Please review the logs." >> $GITHUB_STEP_SUMMARY
        fi
