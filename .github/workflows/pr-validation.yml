name: PR Validation

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]

jobs:
  quick-checks:
    name: Quick Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8 pytest

    - name: Check PR title format
      run: |
        PR_TITLE="${{ github.event.pull_request.title }}"
        if ! echo "$PR_TITLE" | grep -E '^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\(.+\))?:'; then
          echo "❌ PR title must follow conventional commits format"
          echo "   Examples: feat: add new feature"
          echo "             fix: correct bug in processor"
          echo "             docs: update API documentation"
          exit 1
        fi
        echo "✅ PR title format is valid"

    - name: Check for breaking changes
      run: |
        # Check commit messages for BREAKING CHANGE
        if git log --format=%B origin/${{ github.base_ref }}..${{ github.head_ref }} | grep -q "BREAKING CHANGE"; then
          echo "⚠️  BREAKING CHANGE detected - ensure version bump"
        fi

    - name: Quick format check
      run: |
        black --check --diff --fast src/ tests/ || {
          echo "❌ Code formatting issues found. Run: black src/ tests/"
          exit 1
        }

    - name: Quick import check
      run: |
        isort --check-only --diff src/ tests/ || {
          echo "❌ Import sorting issues found. Run: isort src/ tests/"
          exit 1
        }

    - name: Quick lint
      run: |
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Check for print statements
      run: |
        if grep -r "print(" src/ --exclude-dir=__pycache__; then
          echo "⚠️  Warning: print() statements found in src/. Consider using logger instead."
        fi

    - name: Check for TODOs
      run: |
        if grep -r "TODO\|FIXME\|XXX\|HACK" src/ tests/ --exclude-dir=__pycache__; then
          echo "⚠️  Warning: Found TODO/FIXME comments"
        fi

  test-changed-files:
    name: Test Changed Files
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@v41
      with:
        files: |
          src/**/*.py
          tests/**/*.py

    - name: List changed files
      run: |
        echo "Changed files:"
        echo "${{ steps.changed-files.outputs.all_changed_files }}"

    - name: Run tests for changed modules
      if: steps.changed-files.outputs.any_changed == 'true'
      run: |
        # Extract module names and run related tests
        for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
          if [[ $file == src/* ]]; then
            module=$(echo $file | sed 's|src/||' | sed 's|\.py$||' | tr '/' '.')
            echo "Testing module: $module"
            pytest tests/ -v -k "$module" --tb=short || true
          elif [[ $file == tests/* ]]; then
            echo "Running test file: $file"
            pytest "$file" -v --tb=short
          fi
        done

  compatibility-check:
    name: Compatibility Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run quick test suite
      run: |
        pytest tests/ -x --tb=short --maxfail=3

  size-check:
    name: PR Size Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check PR size
      run: |
        LINES_CHANGED=$(git diff --stat origin/${{ github.base_ref }}...${{ github.head_ref }} | tail -1 | sed 's/[^0-9]*\([0-9]*\).*/\1/')
        echo "Lines changed: $LINES_CHANGED"

        if [ "$LINES_CHANGED" -gt 1000 ]; then
          echo "⚠️  Large PR detected ($LINES_CHANGED lines changed)"
          echo "   Consider breaking it into smaller PRs"
        elif [ "$LINES_CHANGED" -gt 500 ]; then
          echo "⚠️  Medium-sized PR ($LINES_CHANGED lines changed)"
        else
          echo "✅ PR size is reasonable ($LINES_CHANGED lines changed)"
        fi

    - name: Check file count
      run: |
        FILES_CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...${{ github.head_ref }} | wc -l)
        echo "Files changed: $FILES_CHANGED"

        if [ "$FILES_CHANGED" -gt 50 ]; then
          echo "⚠️  Many files changed ($FILES_CHANGED files)"
        else
          echo "✅ File count is reasonable ($FILES_CHANGED files)"
        fi

  documentation-check:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check for documentation updates
      run: |
        # Check if code changes include documentation updates
        CODE_CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...${{ github.head_ref }} | grep -E '^src/.*\.py$' | wc -l)
        DOCS_CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...${{ github.head_ref }} | grep -E '^docs/.*\.md$' | wc -l)

        if [ "$CODE_CHANGED" -gt 5 ] && [ "$DOCS_CHANGED" -eq 0 ]; then
          echo "⚠️  Warning: Significant code changes without documentation updates"
          echo "   Consider updating relevant documentation"
        else
          echo "✅ Documentation check passed"
        fi

    - name: Check for CHANGELOG update
      run: |
        if git diff --name-only origin/${{ github.base_ref }}...${{ github.head_ref }} | grep -q "CHANGELOG.md"; then
          echo "✅ CHANGELOG.md updated"
        else
          echo "⚠️  Consider updating CHANGELOG.md"
        fi

  completion-test:
    name: Test CLI Auto-Completion
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Test Bash completion syntax
      run: |
        if [ -f "completions/doc-tools-completion.bash" ]; then
          bash -n completions/doc-tools-completion.bash
          echo "✅ Bash completion syntax valid"
        fi

    - name: Test installation script
      run: |
        if [ -f "scripts/install-completion.sh" ]; then
          bash -n scripts/install-completion.sh
          echo "✅ Installation script syntax valid"
        fi

    - name: Verify completion files
      run: |
        if [ -f "completions/doc-tools-completion.bash" ]; then
          echo "✅ Bash completion file exists"
        fi
        if [ -f "completions/doc-tools-completion.zsh" ]; then
          echo "✅ Zsh completion file exists"
        fi

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [quick-checks, test-changed-files, compatibility-check, size-check, documentation-check, completion-test]
    if: always()

    steps:
    - name: Generate PR summary
      run: |
        echo "## PR Validation Summary"
        echo ""
        echo "All validation checks completed!"
        echo ""
        echo "### Next Steps"
        echo "- Ensure all checks pass"
        echo "- Request review from maintainers"
        echo "- Address any warnings or suggestions"
