version: '3.8'

services:
  # Main application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dms-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5000}:5000"
    volumes:
      # Persistent data
      - ./data:/app/data
      - ./logs:/app/logs
      # Configuration files (read-only)
      - ./config:/app/config:ro
    environment:
      # Application settings
      - FLASK_ENV=${FLASK_ENV:-production}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///data/db/services.db}

      # SMTP settings (optional)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - FROM_EMAIL=${FROM_EMAIL:-noreply@dms.local}

      # Feature flags
      - ENABLE_EMAIL=${ENABLE_EMAIL:-false}
      - ENABLE_WEBHOOKS=${ENABLE_WEBHOOKS:-false}
      - DEBUG=${DEBUG:-false}

      # Performance
      - CACHE_TYPE=${CACHE_TYPE:-simple}
      - MAX_CONTENT_LENGTH=${MAX_CONTENT_LENGTH:-16777216}

      # Security
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      - SESSION_COOKIE_HTTPONLY=${SESSION_COOKIE_HTTPONLY:-true}
      - PERMANENT_SESSION_LIFETIME=${PERMANENT_SESSION_LIFETIME:-3600}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - dms-network

  # Redis cache (optional - for production)
  redis:
    image: redis:7-alpine
    container_name: dms-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - dms-network
    profiles:
      - with-redis

  # Nginx reverse proxy (optional - for production)
  nginx:
    image: nginx:alpine
    container_name: dms-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - web
    networks:
      - dms-network
    profiles:
      - with-nginx

volumes:
  redis-data:
    driver: local

networks:
  dms-network:
    driver: bridge
