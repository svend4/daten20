version: '3.8'

services:
  # Main application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dms-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5000}:5000"
    volumes:
      # Persistent data
      - ./data:/app/data
      # Logs are sent to stdout/stderr (managed by Docker logging driver)
      # Configuration files (read-only)
      - ./config:/app/config:ro
    environment:
      # Application settings
      - FLASK_ENV=${FLASK_ENV:-production}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///data/db/services.db}

      # SMTP settings (optional)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - FROM_EMAIL=${FROM_EMAIL:-noreply@dms.local}

      # Feature flags
      - ENABLE_EMAIL=${ENABLE_EMAIL:-false}
      - ENABLE_WEBHOOKS=${ENABLE_WEBHOOKS:-false}
      - DEBUG=${DEBUG:-false}

      # Performance
      - CACHE_TYPE=${CACHE_TYPE:-simple}
      - MAX_CONTENT_LENGTH=${MAX_CONTENT_LENGTH:-16777216}

      # Security
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      - SESSION_COOKIE_HTTPONLY=${SESSION_COOKIE_HTTPONLY:-true}
      - PERMANENT_SESSION_LIFETIME=${PERMANENT_SESSION_LIFETIME:-3600}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - dms-network

  # Redis cache (optional - for production)
  redis:
    image: redis:7-alpine
    container_name: dms-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - dms-network
    profiles:
      - with-redis

  # Nginx reverse proxy (optional - for production)
  nginx:
    image: nginx:alpine
    container_name: dms-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - web
    networks:
      - dms-network
    profiles:
      - with-nginx

  # PostgreSQL database (for production)
  postgres:
    image: postgres:16-alpine
    container_name: dms-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-daten20}
      - POSTGRES_USER=${POSTGRES_USER:-daten20}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-daten20}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dms-network
    profiles:
      - with-postgres

  # MLflow tracking server (for ML experiments)
  mlflow:
    image: python:3.11-slim
    container_name: dms-mlflow
    restart: unless-stopped
    ports:
      - "${MLFLOW_PORT:-5001}:5000"
    volumes:
      - mlflow-data:/mlflow
      - ./artifacts:/artifacts
    command: >
      bash -c "pip install mlflow psycopg2-binary &&
               mlflow server
               --backend-store-uri sqlite:///mlflow/mlflow.db
               --default-artifact-root /artifacts
               --host 0.0.0.0
               --port 5000"
    networks:
      - dms-network
    profiles:
      - ai-dev

  # Jupyter Lab (for AI/ML development)
  jupyter:
    image: jupyter/tensorflow-notebook:latest
    container_name: dms-jupyter
    restart: unless-stopped
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./src:/home/jovyan/src:ro
      - ./data:/home/jovyan/data
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - GRANT_SUDO=yes
    command: start-notebook.sh --NotebookApp.token=${JUPYTER_TOKEN:-daten20}
    networks:
      - dms-network
    profiles:
      - ai-dev

  # Prometheus monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: dms-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - dms-network
    profiles:
      - monitoring

  # Grafana dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: dms-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    networks:
      - dms-network
    profiles:
      - monitoring

  # Celery worker (for background tasks)
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dms-celery-worker
    restart: unless-stopped
    command: celery -A src.tasks worker --loglevel=info
    volumes:
      - ./data:/app/data
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    depends_on:
      - redis
    networks:
      - dms-network
    profiles:
      - with-celery

  # Celery beat scheduler
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dms-celery-beat
    restart: unless-stopped
    command: celery -A src.tasks beat --loglevel=info
    volumes:
      - ./data:/app/data
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
    depends_on:
      - redis
    networks:
      - dms-network
    profiles:
      - with-celery

  # Ray cluster head (for distributed ML)
  ray-head:
    image: rayproject/ray:latest
    container_name: dms-ray-head
    restart: unless-stopped
    ports:
      - "${RAY_DASHBOARD_PORT:-8265}:8265"
    command: ray start --head --dashboard-host=0.0.0.0 --block
    volumes:
      - ./src:/app/src:ro
      - ray-data:/tmp/ray
    networks:
      - dms-network
    profiles:
      - distributed-ml

volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local
  mlflow-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  ray-data:
    driver: local

networks:
  dms-network:
    driver: bridge
